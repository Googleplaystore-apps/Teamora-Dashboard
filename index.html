<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Teamora-Dashboard/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Teamora Dashboard - Workforce Management Solution">

  <!--
    Google Sign-In client ID.
    Must match the OAuth 2.0 client ID in your Google Cloud Console
    AND the clientId passed to GoogleSignIn() in auth_provider.dart.
  -->
  <meta name="google-signin-client_id"
        content="276240024453-lhge35r36skqdbhsbtno5mcrgko3gn20.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Teamora Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Teamora Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Identity Services — required for google_sign_in on web.
    Keep defer so it doesn't block Flutter bootstrap.
  -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
